# 镜像源配置
mirrors:
  - name: "GitHub Release"
    url_template: "{url}"
    check_availability: false
  - name: "镜像加速1 (gh-proxy.org)"
    url_template: "https://gh-proxy.org/{url}"
    check_availability: true
  - name: "镜像加速2 (hk.gh-proxy.org)"
    url_template: "https://hk.gh-proxy.org/{url}"
    check_availability: true
  - name: "镜像加速3 (cdn.gh-proxy.org)"
    url_template: "https://cdn.gh-proxy.org/{url}"
    check_availability: true

# 应用列表
apps:
  # Android
  - id: "clash-meta-android"
    name: "Clash Meta for Android"
    repo: "MetaCubeX/ClashMetaForAndroid"
    prerelease: true
    asset_filter: "universal-release.apk"
    target_files:
      - path: "zh-CN/android/clash-meta-for-android.md"
        markers:
          version: "<!-- VERSION_START -->{}<!-- VERSION_END -->"
          filename: "<!-- FILENAME_START -->`{}`<!-- FILENAME_END -->"
          download_table: "<!-- DOWNLOAD_TABLE_START -->\n{}\n<!-- DOWNLOAD_TABLE_END -->"
          last_updated: "<!-- UPDATE_TIME_START -->{}<!-- UPDATE_TIME_END -->"
      - path: "en-US/android/clash-meta-for-android.md"
